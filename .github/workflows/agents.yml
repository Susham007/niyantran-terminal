name: Niyantran Agents (scrape every 6h)

# Autonomous data agents. Runs on a schedule and commits fresh JSON snapshots
# to data/. The terminal reads those snapshots, so the frontend never waits on
# a live upstream API. Also runnable on demand from the Actions tab (or the
# admin dashboard's "Run now", which calls the workflow_dispatch API).

on:
  schedule:
    - cron: '0 */6 * * *'      # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:
    inputs:
      feed:
        description: 'Single feed id to run (blank = all)'
        required: false
        default: ''

permissions:
  contents: write               # needed to commit the refreshed snapshots

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run agents
        run: node scrapers/run-all.mjs ${{ github.event.inputs.feed }}

      - name: Commit snapshots
        run: |
          git config user.name  "niyantran-agent[bot]"
          git config user.email "niyantran-agent@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(agents): refresh snapshots $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
